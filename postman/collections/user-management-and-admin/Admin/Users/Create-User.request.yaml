$kind: http-request
name: Create User
method: POST
url: '{{base_url}}/admin/users'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{auth_token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "New User",
      "email": "newuser@example.com",
      "password": "password123",
      "role": "user"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 or 201", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });
      var json = pm.response.json();
      var user = json.data || json;
      pm.test("User has id", function () {
        pm.expect(user.id).to.exist;
      });
      pm.test("User has email", function () {
        pm.expect(user.email).to.exist;
      });
      pm.test("User has role", function () {
        pm.expect(user.role).to.exist;
      });
      pm.collectionVariables.set("user_id", user.id);